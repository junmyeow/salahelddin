name: Deploy to GitHub Pages

# يُستعمل فقط إن اخترت GitHub Pages. على Vercel لا حاجة إليه (وهو غير ضارّ).
# قبل أوّل تشغيل: Settings → Pages → Source → GitHub Actions
# واضبط `base` في astro.config.mjs على اسم المستودع.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # يتجاوز تنزيل Chrome الخاص بـ puppeteer — غير مطلوب للبناء
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
